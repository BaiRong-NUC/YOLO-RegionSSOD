<svg xmlns="http://www.w3.org/2000/svg" width="900" height="598" viewBox="0 0 900 598" role="img" aria-labelledby="title desc">
  <title id="title">S³OD 如何用未标注航拍图训练旋转框检测器</title>
  <desc id="desc">同一裁片的弱增强交给教师，强增强交给学生。SAT 过滤教师预测，SLA 将伪框分配给学生锚框，TNL 用教师评分复核学生候选。人工标注和无标注损失共同更新学生，学生通过 EMA 更新教师。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#41586a"/></marker>
    <style>
      text {font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173448}
      .heading {font-size:26px;font-weight:bold}
      .label {font-size:18px;font-weight:bold}
      .body {font-size:15px}
      .wire {fill:none;stroke:#41586a;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="900" height="598" fill="#fafcfb"/>
  <text x="30" y="47" class="heading">S³OD 如何用未标注航拍图训练旋转框检测器</text>
  <text x="30" y="78" class="body">教师和学生均为 Rotated Faster R-CNN。同一张无标注裁片生成两种视图。</text>
  <g stroke="#9bbab5" fill="#eaf6f2">
    <rect x="35" y="111" width="345" height="66" rx="9"/>
    <rect x="520" y="111" width="345" height="66" rx="9"/>
  </g>
  <g text-anchor="middle">
    <text x="207" y="139" class="label">弱增强 → 教师</text>
    <text x="207" y="163" class="body">预测旋转框、类别及置信度</text>
    <text x="692" y="139" class="label">强增强 → 学生</text>
    <text x="692" y="163" class="body">生成锚框、候选区域及检测预测</text>
  </g>
  <path class="wire" d="M208 177V216"/>
  <path class="wire" d="M692 177V216"/>
  <path class="wire" stroke-dasharray="6 4" d="M380 146H449V237H517"/>
  <g fill="#ecf2fb" stroke="#98b4cd">
    <rect x="35" y="219" width="345" height="71" rx="9"/>
    <rect x="35" y="337" width="345" height="73" rx="9"/>
    <rect x="520" y="219" width="345" height="71" rx="9"/>
  </g>
  <g text-anchor="middle">
    <text x="207" y="249" class="label">SAT · 哪些预测可作伪标签？</text>
    <text x="207" y="275" class="body">按框大小分别估计置信度阈值，保留伪框</text>
    <text x="692" y="249" class="label">TNL · 哪些候选可作负样本？</text>
    <text x="692" y="275" class="body">教师复核学生候选，筛选背景并加权困难负例</text>
    <text x="207" y="368" class="label">SLA · 哪些锚框学习这些目标？</text>
    <text x="207" y="393" class="body">按旋转框几何相似度分配，并按尺度重加权</text>
  </g>
  <path class="wire" d="M208 290V334"/>
  <text x="223" y="319" class="body">伪框对齐到学生视图</text>
  <path class="wire" d="M816 177H882V309H451V374H383"/>
  <text x="558" y="332" class="body">学生锚框</text>
  <path class="wire" d="M692 290V304 M692 314V438H544V461"/>
  <path class="wire" d="M208 410V438H423V461"/>
  <rect x="34" y="465" width="252" height="60" rx="9" fill="#fff4dc" stroke="#cbb77d"/>
  <text x="160" y="491" text-anchor="middle" class="label">有标注裁片 → 学生</text>
  <text x="160" y="514" text-anchor="middle" class="body">人工旋转框产生监督损失</text>
  <path class="wire" d="M286 495H338"/>
  <rect x="341" y="465" width="376" height="60" rx="9" fill="#eaf6f2" stroke="#9bbab5"/>
  <text x="529" y="491" text-anchor="middle" class="label">合并监督损失与无标注损失</text>
  <text x="529" y="514" text-anchor="middle" class="body">反向传播，只更新学生参数</text>
  <path class="wire" d="M529 525V547"/>
  <text x="529" y="572" text-anchor="middle" class="label">用学生参数的指数移动平均（EMA）更新下一轮教师</text>
</svg>
