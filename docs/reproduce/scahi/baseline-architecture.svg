<text x="89" y="1132" font-size="18" fill="#114d6b">F0 · 框级融合</text>
<path d="M238 1153v47" fill="none" stroke="#527480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="75" y="1203" width="326" height="80" rx="7" fill="#d4e4f1" stroke="#8ea2aa"/>
<text x="89" y="1233" font-size="22" fill="#114d6b">输出水平框</text>
<text x="89" y="1262" font-size="18" fill="#114d6b">坐标、类别、置信度</text>
<path d="M401 1113H425V445H478" fill="none" stroke="#527480" stroke-width="2" marker-end="url(#arrow)"/>
<text x="469" y="289" font-size="22" fill="#114d6b">Details · 对照变量</text>
<rect x="481" y="337" width="839" height="82" rx="7" fill="#d5e7f1" stroke="#8ea2aa"/>
<text x="495" y="367" font-size="22" fill="#114d6b">原论文观察的问题</text>
<text x="495" y="396" font-size="18" fill="#114d6b">先把每个视图变成单独的框，会损失跨视图的互补证据。</text>
<rect x="481" y="445" width="839" height="82" rx="7" fill="#ffe5a0" stroke="#8ea2aa"/>
<text x="495" y="475" font-size="22" fill="#114d6b">① F0 · 框级融合</text>
<text x="495" y="504" font-size="18" fill="#114d6b">逐视图得到候选框，再按 IOS 阈值 0.8 去重。</text>
<rect x="481" y="559" width="839" height="82" rx="7" fill="#bae3dc" stroke="#8ea2aa"/>
<text x="495" y="589" font-size="22" fill="#114d6b">固定条件</text>
<text x="495" y="618" font-size="18" fill="#114d6b">相同整图、切片、权重与前向次数；用作者冻结配置，不在 val 调参。</text>
<rect x="481" y="674" width="839" height="82" rx="7" fill="#d8d1ea" stroke="#8ea2aa"/>
<text x="495" y="704" font-size="22" fill="#114d6b">原论文检测器</text>
<text x="495" y="733" font-size="18" fill="#114d6b">YOLO11s（扩展实验）</text>
<text x="469" y="880" font-size="22" fill="#114d6b">输出与评测</text>
<path d="M401 1243H448V992H478" fill="none" stroke="#527480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="481" y="954" width="839" height="82" rx="7" fill="#c2e4be" stroke="#8ea2aa"/>
<text x="495" y="984" font-size="22" fill="#114d6b">十个类别的整图水平框</text>
<text x="495" y="1013" font-size="18" fill="#114d6b">经过类内去重并限制每张图的预测数量。</text>
<path d="M898 1036v68" fill="none" stroke="#527480" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="481" y="1108" width="839" height="82" rx="7" fill="#ffe5a0" stroke="#8ea2aa"/>
<text x="495" y="1138" font-size="22" fill="#114d6b">同机配对评测</text>
<text x="495" y="1167" font-size="18" fill="#114d6b">按原图面积计算 AP_small，在相同图像上记录整图毫秒数。</text>
