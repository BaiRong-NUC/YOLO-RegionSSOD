<svg xmlns="http://www.w3.org/2000/svg" width="568" height="386" viewBox="0 0 568 386">
    <title>同一辆车在整图输入与切片输入中各占多少像素</title>
    <rect width="100%" height="100%" fill="white"/><g fill="#17384b" font-size="15" font-family="Microsoft YaHei, sans-serif">
    <g transform="translate(24,8)"><text y="22" font-size="17">整图缩到 640 后</text>
    <svg y="36" width="240" height="240" viewBox="0 0 48 48">
      <image width="48" height="48" image-rendering="pixelated" href="data:image/png;base64,"/>
      <rect x="19.66666666666663" y="20.333333333333343" width="8.333333333333371" height="8.333333333333314" fill="none" stroke="#ffe45e" stroke-width="0.42"/>
    </svg>
    <text y="303">标注宽高　8.33 × 8.33 px</text>
    <text y="328">最贴近的车框　IoU 0.4400</text></g><g transform="translate(304,8)"><text y="22" font-size="17">原图裁出 640 方块后</text>
    <svg y="36" width="240" height="240" viewBox="0 0 48 48">
      <image width="48" height="48" image-rendering="pixelated" href="data:image/png;base64,"/>
      <rect x="12.0" y="11.0" width="25.0" height="25.0" fill="none" stroke="#ffe45e" stroke-width="0.42"/>
    </svg>
    <text y="303">标注宽高　25.00 × 25.00 px</text>
    <text y="328">最贴近的车框　IoU 0.8057</text></g>
    <text x="24" y="371">两栏各取 48 × 48 个输入像素，同倍率放大。黄框为人工标注。</text></g></svg>