[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regionssod"
version = "0.1.0"
description = "Region-partial semi-supervised tiny-object detection experiments with YOLO"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ultralytics==8.4.172",
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[project.scripts]
regionssod = "regionssod.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
